Classes = []

# Registry entries only: nothing instantiates these categories, so each module
# loads when RelaunchEnforcer or ConsoleClient first needs Thunderbird's
# delegate rather than during startup.
Categories = {
    "enterprise-relaunch-warning-ui": {
        "thunderbird": (
            "resource:///modules/enterprise/EnterpriseHandler.sys.mjs",
            ProcessSelector.MAIN_PROCESS_ONLY,
        ),
    },
    "enterprise-forced-quit-hook": {
        "thunderbird": (
            "resource:///modules/enterprise/EnterpriseShutdown.sys.mjs",
            ProcessSelector.MAIN_PROCESS_ONLY,
        ),
    },
}
